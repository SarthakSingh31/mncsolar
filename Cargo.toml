[package]
name = "mncsolar"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
handlebars = { version = "6", features = ["dir_source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }

[profile.release]
lto = true
strip = true
